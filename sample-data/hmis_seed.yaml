# Synthetic records the mock HMIS starts with (and reloads on the demo reset), so the
# read-only queries have something to find. Synthetic data only: these people do not exist.
#
# Dates are written as days before today (days_ago) so the 90-day briefing window always
# has recent contacts. Client IDs start at HMIS-C-000101, so clients entered during the
# demo still start at HMIS-C-000001. visible_to is "all" or one project id; the demo
# workers belong to horizon_house_outreach (config/workers.yaml).
#
# Statuses [TBC with Horizon House]: id_documents requested | received;
# housing_assessments scheduled | completed.

clients:
  - id: HMIS-C-000101
    first_name: Jordan
    last_name: Sample
    date_of_birth: 1979-06-12
    ssn_last4: "3301"
    contacts: [{days_ago: 3, quadrant: sw}, {days_ago: 17, quadrant: sw}]
    id_documents: [{doc_type: state_id, status: requested, days_ago: 10}]
    housing_assessments: [{status: scheduled, days_ago: -5}]
