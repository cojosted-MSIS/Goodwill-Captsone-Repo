# What a correct parse of each sample email looks like. Used by the stub parser tests and
# by scripts/compare_models.py to score LLMs.
#
#   fields     exact expected values
#   any_value  must be filled, any wording (free-text lists)
#   medium     fields whose confidence must not be high (hedged wording)
#   Every other field a parser may fill must be left blank: filling one is an inferred value.
#   case_note_must_include / case_note_must_not_include: lowercase substrings
#   never_anywhere: text that must not appear in any value, source, or the case note

01_clean_new_client:
  hmis_search_stated: true
  fields:
    first_name: Pat
    last_name: Example
    name_quality: full_name_reported
    date_of_birth: "1975-03-04"
    dob_quality: full_dob_reported
    ssn_last4: "4821"
    ssn_quality: approximate_or_partial_ssn_reported
    race: [white]
    ethnicity: non_hispanic_latino
    gender: [male]
    disabling_condition: "yes"
    veteran_status: "no"
    service_area: sw
    prior_living_situation: place_not_meant_for_habitation
    current_living_situation: place_not_meant_for_habitation
    times_homeless_past_three_years: three_times
    months_homeless_past_three_years: more_than_12_months
    project_id: PRJ-SO-DEMO
    ce_region: "7"
    household_type: single_adult
  any_value: [contact_service]
  medium: [times_homeless_past_three_years, months_homeless_past_three_years]
  notices: []
  case_note_must_not_include: [bad back]

