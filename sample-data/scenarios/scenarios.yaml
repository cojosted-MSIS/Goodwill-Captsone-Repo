# Demo scenarios for the review UI and the demo script (task 5). Synthetic data only.
#
# A scenario names an email file (relative to this folder). A `scripted` block makes the
# demo parser return a fixed, deliberate error for that exact note, so Scenario B always
# shows the worker catching a mistake. Scripted drafts are labelled on screen as a scripted
# demo example, never as a live model result. If the worker edits the note before sending,
# it is parsed normally. `subject` overrides the email file's subject; {date} becomes the
# date the phone sends on (M/D), so the subject matches the encounter date on screen.

A:
  title: Clean note, confirmed on the first reply
  summary: Every required field is in the note. The worker reads the draft and replies CONFIRM.
  email: ../emails/01b_clean_new_client_complete.txt
  subject: "New client: Pat Example {date}"

B:
  title: Parser error, corrected by the worker
  summary: >-
    The draft reads the declined shelter bed as where Rosa is staying now and is missing
    veteran status. The worker corrects both in a plain-language reply, then confirms.
  email: scenario_b_declined_shelter.txt
  subject: "New client: Rosa Sample {date}"
  suggested_reply: "Current living situation: staying outside, she declined the shelter. Not a veteran."
  scripted:
    label: >-
      Scripted demo example. This draft contains a deliberate error written for the demo
      (a declined shelter bed read as the current living situation, a mistake seen in the
      model evaluation). It is not a live model result.
    # The error: the declined offer is read as where she is staying now.
    fields:
      current_living_situation:
        value: emergency_shelter
        source: "Offered her a bed at the women's shelter, she said not tonight, maybe next week."
        confidence: high
    case_note: >-
      Met Rosa S. in the Northeast quadrant. She is staying at the women's shelter.
      Provided a bus pass and the food resource list. Follow up Monday or Tuesday.

# Scenarios C, D and E (add-existing-client-updates). Run C after Scenario A: it uses the
# client ID from Scenario A's receipt, and says so when there is none. The seed (sample-data/hmis_seed.yaml)
# holds Robin Demo twice (HMIS-C-000113 matches the SSN digits, 114 does not) and Sam Example
# twice (HMIS-C-000109 and 110, different SSN digits). These are different people who share a
# name and date of birth; the seed holds no duplicate records.

C:
  title: Second visit to a neighbor entered earlier
  summary: >-
    An "Update:" note for Scenario A's client, using the client ID from Scenario A's receipt:
    a case note and a service entry, reviewed and confirmed like any draft.
  email: scenario_c_second_visit.txt
  client_from: A   # {client_id} in the note becomes the client ID from Scenario A's newest receipt

D1:
  title: Same name in HMIS, likely the same person (SAME CLIENT)
  summary: >-
    A new-client note for Robin Demo. HMIS has two clients with that name and date of birth:
    HMIS-C-000113 has the same SSN digits (recommended), and HMIS-C-000114 is an older, exited
    record with different digits (a warning). Reply SAME CLIENT HMIS-C-000113 and the note
    becomes an update for that client.
  email: scenario_d1_same_client.txt
  suggested_reply: "SAME CLIENT HMIS-C-000113"

D2:
  title: Same name in HMIS, different SSN digits (DIFFERENT PERSON)
  summary: >-
    A new-client note for Sam Example. Two clients in HMIS share the name and date of birth
    but have different SSN digits. Reply DIFFERENT PERSON with a reason, then CONFIRM: the
    client is entered as new, marked confirmed distinct.
  email: scenario_d2_different_person.txt
  suggested_reply: "DIFFERENT PERSON: he is about 20 years younger than both people in HMIS"

E1:
  title: Pre-visit briefing for the SW quadrant (read only)
  summary: >-
    A "Query:" email. The answer lists neighbors with recent contacts in the SW quadrant,
    including Scenario A's client, because the contact recorded its quadrant. Nothing in
    HMIS changes.
  email: scenario_e1_briefing.txt

E2:
  title: Status check for an ID document (read only)
  summary: >-
    A "Query:" email asking whether Jordan Sample's ID has come in. The answer gives the
    document status only. Nothing in HMIS changes.
  email: scenario_e2_status.txt

E3:
  title: No-contact watchlist (read only)
  summary: >-
    A "Query:" email asking who is coming up on 60 days with no contact. The answer lists
    neighbors with an active enrollment in two groups, past 60 days and approaching (46 to 60
    days), most overdue first. Nothing in HMIS changes.
  email: scenario_e3_no_contact.txt
