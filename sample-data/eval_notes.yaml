# Hard synthetic notes for scripts/eval_parser.py. ALL DATA IS MADE UP.
#
# written_by: who wrote the note and its expected answers. Every note below was written by
# Claude Code in the same session as the prompt (intake-v2.1), so the prompt may be tuned to
# them. Teammates: add notes written independently, with written_by set to your name and the
# expected answers filled in BEFORE you run the evaluation.
#
# expect: only the listed fields are scored. "unknown" means the field must be left blank.
# hmis_search_stated: true or false. case_note_must_not_include: lowercase substrings.

- id: e01
  tests: hearsay only, no DOB
  written_by: claude-code
  sent: 2026-10-14T09:00:00-04:00
  body: >-
    Talked with Ray Example's friend by the bus shelter, SE quadrant. Ray wasn't there. His friend thinks he
    might be staying at his sister's place. No DOB on file. Searched HMIS for Ray, no record.
  expect:
    first_name: Ray
    current_living_situation: unknown
    prior_living_situation: unknown
    dob_quality: unknown
    service_area: se
  hmis_search_stated: true

