# Demo runtime settings.

# Drafts still in review after this many hours move to expired and go to the supervisor queue [TBC].
supervisor_timeout_hours: 48

# Email copies are deleted this many hours after submission. 0 deletes at submission.
# Goodwill sets the real limit [TBC: design.md open question 8].
email_retention_hours: 0

# Which parser implementation to use: rule_stub (default, used by tests) or reallms.
parser: rule_stub

# REALLMS, the IU-hosted LLM service. Synthetic data only.
# See docs/reference/reallms/REALLMS_GUIDE.md. Environment variables (from .env) override:
#   LLM_BASE_URL  overrides base_url
#   LLM_MODEL     overrides model (must be the model or one of the fallback models)
#   LLM_API_KEY   the API key. Never stored in this file, never logged or committed.
reallms:
  base_url: https://reallms.rescloud.iu.edu/direct/v1
  model: gemma-4-31B-it
  # Allowed only with a v2-style prompt (categories defined, note marked as data only).
  fallback_models: [qwen3.8-27b]
  # Not recommended: refused unless explicitly overridden (LLM_ALLOW_NOT_RECOMMENDED=1, or the
  # model comparison in scripts/eval_parser.py, which measures it on purpose). In the 2026-10-20
  # evaluation gpt-oss-120b gave the most wrong answers that passed every check (5 of 24).
  not_recommended_models: [gpt-oss-120b]
  fallback_requires_prompt_style: v2
  temperature: 0
  timeout_seconds: 180
  # Room for the model's reasoning tokens plus our 45-field reply; too low cuts the JSON off
  # (finish_reason "length"). 2000 was too low for this schema in the 2026-10-20 evaluation.
  max_tokens: 8000
  # Retries with exponential backoff on HTTP 429 and 5xx.
  http_retries: 3
  backoff_seconds: 2

# Read-only HMIS queries by email (add-hmis-readonly-queries). The system reads HMIS only
# through these fixed queries, on a read-only connection to the mock HMIS database
# [TBC with CHIP and the HMIS administrator: the real HMIS has no confirmed read access].
hmis_queries:
  database: data/mock_hmis.db       # the file python -m mock_hmis writes (its --db default)
  subject_prefix: "Query:"
  row_limit: 25
  briefing_window_days: 90
  # No-contact watchlist (add-no-contact-query) [TBC with Horizon House: the right numbers, and
  # what counts as a contact]. Listed: no_contact_days - no_contact_warning_days days or more
  # since the last contact ("Approaching", 46 to 60), and more than no_contact_days ("Past").
  no_contact_days: 60
  no_contact_warning_days: 14
  client_id_pattern: '^HMIS-C-\d{6}$'   # [TBC: the real format]
  status_types:                      # [TBC with Horizon House]
    id_document: ID document
    housing_assessment: Housing assessment
  email_retention_hours: 24          # query emails are deleted this long after the reply [TBC]

# Same name and date of birth verification (add-existing-client-updates).
verification:
  # DIFFERENT PERSON when the last four SSN digits match needs a reason at least this long, and
  # the decision is flagged for supervisor review afterward (not blocking) [TBC with Goodwill].
  min_reason_length_matching_digits: 40
  # SAME CLIENT: these answers from the note are shown as "update in HMIS yourself" and never
  # written, because the client's record in HMIS may already hold different answers.
  update_in_hmis_yourself: [race, ethnicity, gender, disabling_condition, veteran_status]

# What the staging store keeps (add-existing-client-updates).
#   demo        keeps the synthetic values after submission so the staff screens still work
#               (the exception, for the demo only)
#   production  reduces each submitted draft to a stub of IDs, states, versions, and times
retention:
  mode: demo
  unsubmitted_days: 7   # held notes and drafts never submitted are deleted after this many days
  match_key_env: INTAKE_MATCH_KEY   # the open-draft hash key; required in production mode

# Updates to clients already in HMIS (add-existing-client-updates).
updates:
  subject_prefix: "Update:"
  client_id_in_text: '\b(?P<id>HMIS-C-\d+)\b'   # finds a client ID in the subject or note; format checked separately

# Where the mock HMIS service listens.
hmis_base_url: http://127.0.0.1:8765
hmis_timeout_seconds: 5

# Web application (add-web-application). Sessions are kept on the server; the browser holds only
# an HttpOnly, SameSite=Strict cookie. [TBC with Goodwill IT: the real timeouts and sign-in.]
web:
  session_idle_minutes: 30      # signed out after this long with no request
  session_absolute_hours: 12    # signed out this long after sign-in, however active
  cookie_secure: auto           # auto: Secure over https (always in production); also true or false
  sign_in:
    max_failures: 5             # failed sign-ins for one username within window_minutes lock it
    window_minutes: 15
    lockout_minutes: 15         # every sign-in for a locked username is refused, right or wrong
    max_attempts_per_client: 20 # sign-in attempts from one client address within window_minutes
  # Idempotency-Key on our own writes (add-web-application): a repeat with the same key from the same
  # user gets the first result and makes nothing new. Keys are kept only as hashes.
  idempotency_key_hours: 96     # longer than the device queue's 72 hours, so a late retry is still recognized [TBC]
  idempotency_wait_seconds: 10  # a repeat sent while the first is still running waits this long for its result

# Channels. The web application is always on. Email is optional and off by default; the email
# demo (scripts/demo.py) and the email tests switch it on [TBC with the sponsors: keep email as
# a fallback?].
channels:
  email:
    enabled: false
