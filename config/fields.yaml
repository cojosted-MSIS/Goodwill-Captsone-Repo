    - {id: safe_haven, label: Safe haven}
    - {id: transitional_housing, label: Transitional housing}
    - {id: staying_with_family, label: "Staying or living with family, temporary"}
    - {id: staying_with_friends, label: "Staying or living with friends, temporary"}
