  relationship_to_hoh:
    - {id: self, label: Self (head of household)}
  household_type:
    - {id: single_adult, label: Single adult}
    - {id: adults_with_children, label: Household with adults and children}
    - {id: children_only, label: Household with only children}
  quadrant:
    - {id: nw, label: Northwest quadrant}
    - {id: ne, label: Northeast quadrant}
    - {id: sw, label: Southwest quadrant}
    - {id: se, label: Southeast quadrant}
  assessment_contact_type:
    - {id: in_person_street_contact, label: "In person, street contact"}
    - {id: in_person_other, label: "In person, other location"}
    - {id: phone, label: Phone}
    - {id: virtual, label: Virtual}

fields:
  # Basic client information
  first_name:
    section: client
    label: First name
    type: string
    required: true
    client_answer: true
  last_name:
    section: client
    label: Last name
    type: string
    client_answer: true
    required_when: {field: name_quality, in: [full_name_reported]}
  name_quality:
    section: client
    label: Name quality
    type: enum
    enum: name_quality
    required: true
    client_answer: true
  date_of_birth:
    section: client
    label: Date of birth
    type: date
    client_answer: true
    required_when: {field: dob_quality, in: [full_dob_reported]}
  dob_quality:
    section: client
    label: Date of birth quality
    type: enum
    enum: dob_quality
    required: true
    client_answer: true
  ssn_last4:
    section: client
    label: SSN (last four digits)
    type: ssn_last4
    client_answer: true
    required_when: {field: ssn_quality, in: [full_ssn_reported, approximate_or_partial_ssn_reported]}
  ssn_quality:
    section: client
    label: SSN quality
    type: enum
    enum: ssn_quality
    required: true
    client_answer: true
  race:
    section: client
    label: Race
    type: multi_enum
    enum: race
    max_items: 5
    required: true
    client_answer: true
  ethnicity:
    section: client
    label: Ethnicity
    type: enum
    enum: ethnicity
    required: true
    client_answer: true
  gender:
    section: client
    label: Gender
    type: multi_enum
    enum: gender
    max_items: 5
    required: true
    client_answer: true
  disabling_condition:
    section: client
    label: Disabling condition
    type: enum
    enum: yes_no
    required: true
    client_answer: true
  veteran_status:
    section: client
    label: Veteran status
    type: enum
    enum: yes_no
    required: true
    client_answer: true

  # Program enrollment and universal data elements
  project_id:
    section: enrollment
    label: Project
    type: string
    required: true
  enrollment_date:
    section: enrollment
    label: Enrollment date
    type: date
    required: true
    fallback: email_date
  relationship_to_hoh:
    section: enrollment
    label: Relationship to head of household
    type: enum
    enum: relationship_to_hoh
    required: true
    fixed_value: self
  prior_living_situation:
    section: enrollment
    label: Prior living situation
    type: enum
    enum: living_situation
    required: true
    client_answer: true
  length_of_stay:
    section: enrollment
    label: Length of stay in prior living situation
    type: enum
    enum: length_of_stay
    client_answer: true
    required_when:
      field: prior_living_situation
      in: [place_not_meant_for_habitation, emergency_shelter, safe_haven]
  approx_date_homelessness_started:
    section: enrollment
    label: Approximate date homelessness started
    type: date
    client_answer: true
    required_when:
      field: prior_living_situation
      in: [place_not_meant_for_habitation, emergency_shelter, safe_haven]
  times_homeless_past_three_years:
    section: enrollment
    label: Times on the street, in ES, or SH in the past three years
    type: enum
    enum: times_homeless
    required: true
    client_answer: true
  months_homeless_past_three_years:
    section: enrollment
    label: Total months homeless in the past three years
    type: enum
    enum: months_homeless
    required: true
    client_answer: true

  # Coordinated Entry enrollment and triage assessment
  ce_region:
    section: ce_enrollment
    label: Coordinated Entry region
    type: string
    required: true
  ce_project_id:
    section: ce_enrollment
    label: Coordinated Entry project
    type: string
    required: true
    fallback: program_default
  assessment_location:
    section: ce_enrollment
    label: Assessment location
    type: string
    required: true
    fallback: program_default
  assessment_contact_type:
    section: ce_enrollment
    label: Assessment contact type
    type: enum
    enum: assessment_contact_type
    required: true
    fallback: program_default
  current_living_situation:
    section: ce_enrollment
    label: Current living situation
    type: enum
    enum: living_situation
    required: true
    client_answer: true
  household_type:
    section: ce_enrollment
    label: Household type
    type: enum
    enum: household_type
    required: true
  information_date:
    section: ce_enrollment
    label: Information date
    type: date
    required: true
    fallback: email_date
  verified_by_project:
    section: ce_enrollment
    label: Verified by project
    type: string
    required: true
    fallback: program_default
  record_contact:
    section: ce_enrollment
    label: Record contact
    type: boolean
    required: true
    fixed_value: true
  contact_service:
    section: ce_enrollment
    label: Contact service
    type: list
    required: true

  # Case note: generated from the email and sent with the program enrollment
  # [TBC: design.md open question 10, ask CHIP]. Never stored in the audit record.
  case_note:
    section: enrollment
    label: Case note (generated, check the wording)
    type: text
    required: true

  # Encounter
  service_area:
    section: encounter
    label: Service area (quadrant only)
    type: enum
    enum: quadrant
    required: true

# Listed in every review email as completed in HMIS by the worker.
remaining_in_hmis:
  - Client consent and signatures (pending, completed with the neighbor in HMIS)
  - VI-SPDAT
  - Diversion assessment
  - Domestic violence and lethality questions
  - Income and benefits
  - Health insurance
  - Veteran assessment details
  - Additional household members
