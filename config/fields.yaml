# Draft field definitions.
# Field names are illustrative and must be matched to the real HMIS field list with CHIP
# and the HMIS administrator. Change fields here, not in code.
#
# Keys per field:
#   section        which part of the draft (and which HMIS entry operation) the field belongs to
#   type           string | date | enum | multi_enum | boolean | text | ssn_last4 | list
#   enum           name of an option list under `enums` (enum and multi_enum only)
#   required       always required before submission
#   required_when  required only when another field has one of the listed values
#   client_answer  true for answers the neighbor gives; these are never filled from defaults
#   fallback       email_date or program_default, used only when the email does not state a value
#   fixed_value    a value the demo always sets (household of one, record contact)

sections:
  client:
    label: Basic client information
    hmis_operation: create_client
  enrollment:
    label: Program enrollment and universal data
    hmis_operation: enroll_in_program
  ce_enrollment:
    label: Coordinated Entry enrollment and triage
    hmis_operation: create_ce_enrollment
  encounter:
    label: Encounter (kept in the draft and case note, not entered as its own HMIS field)
    hmis_operation: null

