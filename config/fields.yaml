    - {id: partial_street_or_code_name, label: "Partial, street name, or code name reported"}
    - {id: client_doesnt_know, label: Client doesn't know}
    - {id: client_refused, label: Client refused}
    - {id: data_not_collected, label: Data not collected}
  dob_quality:
    - {id: full_dob_reported, label: Full DOB reported}
